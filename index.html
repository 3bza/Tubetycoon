<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creator Empire</title>
<style>
:root{--red:#dd2929;--dark:#07111d;--panel:#10273d;--blue:#2d8be6;--green:#22ba6b;--gold:#f4b720;--muted:#a6b4c2}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#1d4567,#091827 48%,#03070b);color:#fff;font-family:Arial,sans-serif}
#app{min-height:100vh;padding-bottom:78px}.top{height:68px;background:linear-gradient(90deg,#c82020,#e33434);display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:300;position:sticky;top:0;z-index:8}.back{position:absolute;left:15px;font-size:17px;color:#ffd7d7}
.content{padding:13px}.card{background:linear-gradient(145deg,#16354e,#0c2032);border:1px solid #ffffff12;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 8px 22px #0005}
.hero{text-align:center;padding:28px 12px}.logo{font-size:34px;font-weight:800}.logo span{color:#48a8ff}.muted{color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;border-radius:9px;min-height:116px;background:linear-gradient(145deg,#17344e,#0d1f30);color:white;font-size:17px;font-weight:bold}.tile .ico{font-size:38px;display:block;margin-bottom:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#07111edb;backdrop-filter:blur(10px);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;border-top:1px solid #ffffff16}.stat{text-align:center;padding-top:10px;font-size:12px}.stat b{display:block;font-size:16px;margin-top:4px}.r{color:#ff5d5d}.c{color:#69d7f0}.g{color:#53e093}.y{color:#ffd05a}
button{font-family:inherit}.btn{width:100%;border:0;border-radius:7px;padding:13px;margin-top:8px;background:linear-gradient(135deg,#247ccc,#42a6ff);color:#fff;font-size:16px;font-weight:bold}.btn.red{background:linear-gradient(135deg,#bd2020,#e43b3b)}.btn.green{background:linear-gradient(135deg,#138c50,#31c979)}.btn.gold{background:linear-gradient(135deg,#d68d08,#f6bf24)}
.list{background:#edf0f4;color:#27313a;border-radius:6px;padding:13px;margin:8px 0;box-shadow:0 4px 10px #0004}.list h3{margin:0 0 7px;font-weight:500}.meta{color:#68717b;font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
input,select{width:100%;border:0;border-radius:7px;padding:14px;font-size:16px;margin:6px 0 12px}.trend{border-left:4px solid var(--gold)}.bar{height:10px;background:#07111d;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2c86de,#62bbff)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:10px;background:#234d77;border-radius:7px;overflow:hidden}.tabs button{border:0;background:transparent;color:#fff;padding:11px}.tabs .on{background:#447cc5}
.row{display:flex;justify-content:space-between;align-items:center;background:#edf0f4;color:#27313a;padding:13px;border-radius:6px;margin:8px 0}.smallbtn{border:0;background:#db2a2a;color:#fff;border-radius:5px;padding:9px;font-weight:bold}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.modal{width:100%;max-width:430px;background:#10263c;border-radius:12px;padding:22px;box-shadow:0 15px 40px #000}.modal h2{margin-top:0}.hidden{display:none}.toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-130px);transition:.3s;background:#14314b;padding:12px 18px;border-radius:7px;z-index:30;border:1px solid #ffffff20}.toast.show{transform:translate(-50%,0)}
.badge{display:inline-block;padding:5px 8px;background:#2d8be6;border-radius:4px;font-size:12px;margin-left:5px}.comment{border-bottom:1px solid #ffffff12;padding:11px 0}.comment:last-child{border:0}.comment b{color:#61b8ff}.locked{opacity:.6}
</style></head><body>
<div id="toast" class="toast"></div><div id="app"><div class="top"><span id="back" class="back"></span><span id="ttl">Creator Empire</span></div><div id="content" class="content"></div></div><div id="bottom" class="bottom"></div>
<div id="welcome" class="overlay hidden"><div class="modal"><h2>🎥 Welcome, Creator!</h2><p class="muted">Start your own channel and build your way from zero subscribers to a global creator.</p><input id="channelName" placeholder="Enter your channel name"><select id="starter"><option>Gaming</option><option>Football</option><option>Vlogs</option><option>Technology</option></select><button class="btn green" onclick="startGame()">START CAREER</button></div></div>
<script>
const trends=["Football transfer window","New game release","Viral reaction","Creator drama","Champions League night","Tech product launch"];
const comments=["That was awesome! Keep it up 🔥","I’m your biggest fan!","The editing is getting better every video.","This video deserves more views.","Waiting for the next one!"];
let d=JSON.parse(localStorage.getItem("ce_pro")||"null")||{started:false,channel:"",niche:"Gaming",screen:"home",subs:0,money:100,views:0,videos:0,day:1,camera:1,mic:1,pc:1,light:1,rep:0,history:[],sponsor:false};
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString(),cash=n=>"$"+n.toFixed(2);
function save(){localStorage.setItem("ce_pro",JSON.stringify(d))}
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function startGame(){let n=$("#channelName").value.trim();d.channel=n||"My Channel";d.niche=$("#starter").value;d.started=true;save();$("#welcome").classList.add("hidden");render()}
function setTop(t,back=true){$("#ttl").textContent=t;$("#back").textContent=back?"‹ Back":""}
function bottom(){return `<div class="stat">👤<b class="r">${fmt(d.subs)}</b></div><div class="stat">💰<b class="c">${cash(d.money)}</b></div><div class="stat">🎥<b class="g">${d.videos}</b></div><div class="stat">📅<b class="y">${d.day}</b></div>`}
function go(x){d.screen=x;save();render()}
function home(){setTop("Office",false);return `<div class="hero card"><div class="logo">CREATOR <span>EMPIRE</span></div><div style="font-size:21px;margin-top:8px">${d.channel}</div><p class="muted">${d.niche} Creator • Reputation ${d.rep}</p></div>
<div class="grid"><button class="tile" onclick="go('record')"><span class="ico">🎮</span>Record game</button><button class="tile" onclick="go('movie')"><span class="ico">🎬</span>Record movie</button><button class="tile" onclick="go('career')"><span class="ico">📈</span>Career</button><button class="tile" onclick="go('city')"><span class="ico">🏙️</span>City</button></div>
<div class="card trend"><b>🔥 TRENDING NOW</b><h2 style="margin:8px 0">${trends[(d.day-1)%trends.length]}</h2><span class="muted">Create the right video at the right time for a reach bonus.</span></div>
<div class="card"><b>Next milestone: ${d.subs<1000?"1,000":d.subs<10000?"10,000":"100,000"} subscribers</b><div class="bar"><i style="width:${Math.min(100,(d.subs/(d.subs<1000?1000:d.subs<10000?10000:100000))*100)}%"></i></div></div>`}
function record(){setTop("Record game");return `<div class="card"><h2>Create a video</h2><label>Content type</label><select id="niche"><option>Gaming</option><option>Football</option><option>Vlogs</option><option>Technology</option><option>Entertainment</option></select><label>Video title</label><input id="title" placeholder="Write an attention-grabbing title..."><label>Thumbnail quality</label><select id="thumb"><option value="1">Basic</option><option value="2">Good</option><option value="3" selected>Great</option><option value="4">Amazing</option><option value="5">Legendary</option></select><button class="btn" onclick="publish()">▶ RECORD & PUBLISH</button></div>
<div class="card"><b>Production quality</b><div class="bar"><i style="width:${Math.min(100,((d.camera+d.mic+d.pc+d.light)/4)*10)}%"></i></div><span class="muted">Upgrade equipment in Career to improve your results.</span></div>`}
function movie(){setTop("Record movie");return `<div class="tabs"><button class="on">SIMPLE VLOGS</button><button>TAGS</button><button>OTHER</button></div><div class="list"><h3>📷 Basic vlogs</h3><span class="muted">Easy content. Good for beginners.</span><button class="btn" onclick="go('record')">RECORD</button></div><div class="list"><h3>🕒 Daily vlogs</h3><span class="muted">More engagement and better audience growth.</span><button class="btn" onclick="go('record')">RECORD</button></div><div class="list"><h3>🎁 Fan opening</h3><span class="muted">Unlocks at 1,000 subscribers.</span><button class="btn gold" onclick="locked(1000)">CHECK</button></div>`}
function career(){setTop("Career");let items=[["camera","📷 Camera"],["mic","🎙 Microphone"],["pc","💻 Editing PC"],["light","💡 Lighting"]];return `<div class="card"><h2>Creator progression</h2><p class="muted">Your equipment directly affects quality, views and revenue.</p></div>${items.map(([k,n])=>{let cost=100*Math.pow(2,d[k]-1);return `<div class="row"><div><b>${n}</b><br><span class="muted">Level ${d[k]}/10 • ${cash(cost)}</span></div><button class="smallbtn" onclick="upgrade('${k}')">UPGRADE</button></div>`}).join("")}<div class="card"><h3>🏆 Career status</h3><p>${d.subs<100?"Unknown creator":d.subs<1000?"Small creator":d.subs<10000?"Rising creator":d.subs<100000?"Popular creator":"Global icon"} </p></div>`}
function city(){setTop("City");return `<div class="card" style="text-align:center;padding:25px"><div style="font-size:65px">🏙️</div><h2>Creator City</h2><p class="muted">New opportunities unlock as you grow.</p></div>
${cityRow("🎮 Game shop","Buy games and unlock better gaming content",500)}
${cityRow("🏢 Studio","Upgrade from your bedroom to a professional studio",5000)}
${cityRow("🤝 Brand district","Unlock sponsors and partnerships",20000)}
${d.sponsor?`<div class="card"><h3>🤝 Active sponsor</h3><p class="muted">Complete your next video for a bonus payout.</p></div>`:""}` }
function cityRow(icon,name,need){return `<div class="row ${d.subs<need?'locked':''}"><div><b>${icon} ${name}</b><br><span class="muted">Requires ${fmt(need)} subscribers</span></div><button class="smallbtn" onclick="unlock(${need},'${name}')">ENTER</button></div>`}
function unlock(n,name){if(d.subs<n)return toast("Need "+fmt(n)+" subscribers");if(name==="Brand district"){d.sponsor=true;save();toast("Sponsor unlocked!")}else toast(name+" unlocked for the next update!")}
function locked(n){if(d.subs<n)toast("Need "+fmt(n)+" subscribers");else go("record")}
function upgrade(k){let cost=100*Math.pow(2,d[k]-1);if(d[k]>=10)return toast("Maximum level reached");if(d.money<cost)return toast("Not enough money");d.money-=cost;d[k]++;save();toast("Upgrade complete!");render()}
function publish(){let niche=$("#niche").value,title=$("#title").value.trim(),thumb=+$("#thumb").value,eq=(d.camera+d.mic+d.pc+d.light)/4;let tr=trends[(d.day-1)%trends.length].toLowerCase();let match=(niche==="Football"&&tr.includes("football"))||(niche==="Gaming"&&tr.includes("game"))?1.65:1;let titleBonus=title?Math.min(1.35,1+title.length/100):1;let luck=.7+Math.random()*1.05;let views=Math.max(30,Math.round(260*(.8+eq*.27+thumb*.18)*match*titleBonus*luck*(1+Math.log10(d.subs+10)*.33)));let subs=Math.max(1,Math.round(views*(.007+thumb*.0025)));let rev=views*(.00075+eq*.00012);let sponsorBonus=d.sponsor?50:0;d.views+=views;d.subs+=subs;d.money+=rev+sponsorBonus;d.videos++;d.day++;d.rep+=Math.max(1,Math.floor(views/1000));d.history.unshift({title:title||niche+" video",views,subs,rev:rev+sponsorBonus});if(d.history.length>8)d.history.pop();save();result(views,subs,rev+sponsorBonus,title||niche+" video")}
function result(v,s,r,t){setTop("Video results");$("#content").innerHTML=`<div class="card" style="text-align:center"><h1>${v>10000?"🔥 VIRAL VIDEO!":"🎉 VIDEO PUBLISHED"}</h1><h3>${t}</h3><div class="list"><h2>👀 ${fmt(v)} views</h2><div class="meta">➕ ${fmt(s)} subscribers <span>💰 ${cash(r)}</span></div></div><button class="btn" onclick="go('comments')">VIEW COMMENTS 💬</button><button class="btn green" onclick="go('record')">MAKE ANOTHER VIDEO</button><button class="btn red" onclick="go('home')">OFFICE</button></div>`}
function commentsPage(){setTop("Comments");let latest=d.history[0];if(!latest)return `<div class="card">No videos yet.</div>`;return `<div class="card"><h2>${latest.title}</h2>${comments.map((x,i)=>`<div class="comment"><b>${["PixelFan","HassanPro","GameMaster","FootyZone","CreatorKing"][i]}</b><br><span class="muted">${x}</span></div>`).join("")}<button class="btn red" onclick="go('home')">BACK TO OFFICE</button></div>`}
function analytics(){setTop("Analytics");let rows=d.history.map((x,i)=>`<div class="list"><h3>#${d.videos-i} ${x.title}</h3><div class="meta">▶ ${fmt(x.views)} <span>👤 +${fmt(x.subs)}</span><span>💰 ${cash(x.rev)}</span></div></div>`).join("");return `<div class="card"><h2>Channel analytics</h2><p>👀 Total views: <b>${fmt(d.views)}</b></p><p>👤 Subscribers: <b>${fmt(d.subs)}</b></p><p>🎥 Videos: <b>${d.videos}</b></p></div>${rows||'<div class="card muted">Publish your first video to see analytics.</div>'}`}
function render(){if(!d.started)$("#welcome").classList.remove("hidden");let out=d.screen==="record"?record():d.screen==="movie"?movie():d.screen==="career"?career():d.screen==="city"?city():d.screen==="comments"?commentsPage():d.screen==="analytics"?analytics():home();$("#content").innerHTML=out;$("#bottom").innerHTML=`<div class="stat" onclick="go('home')">🏠<b>Office</b></div><div class="stat" onclick="go('record')">🎥<b>Record</b></div><div class="stat" onclick="go('analytics')">📊<b>Stats</b></div><div class="stat" onclick="go('career')">📈<b>Career</b></div>`}
window.creatorBack=()=>{if(d.screen!=="home")go("home");else toast("Use Android back again to exit")};render();
</script></body></html>
